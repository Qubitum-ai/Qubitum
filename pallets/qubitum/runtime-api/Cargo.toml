[package]
name = "pallet-qubitum-runtime-api"
version = "0.1.0"
description = "Runtime API for Qubitum protocol state queries."
authors = ["Qubitum AI"]
edition.workspace = true
license = "Unlicense"
publish = false
repository = "https://github.com/Qubitum-ai/Qubitum"

[dependencies]
codec = { workspace = true, features = ["derive"] }
pallet-qubitum.workspace = true
qubitum-protocol.workspace = true
sp-api.workspace = true
sp-runtime.workspace = true
sp-std.workspace = true
subtensor-runtime-common.workspace = true

[features]
default = ["std"]
std = [
	"codec/std",
	"pallet-qubitum/std",
	"qubitum-protocol/std",
	"sp-api/std",
	"sp-runtime/std",
	"sp-std/std",
	"subtensor-runtime-common/std",
]
