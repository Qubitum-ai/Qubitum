[package]
name = "pallet-qubitum-rpc"
version = "0.1.0"
description = "RPC interface for Qubitum protocol state queries."
authors = ["Qubitum AI"]
edition.workspace = true
license = "Unlicense"
publish = false
repository = "https://github.com/Qubitum-ai/Qubitum"

[dependencies]
codec = { workspace = true, features = ["derive"] }
jsonrpsee = { workspace = true, features = ["client-core", "server", "macros"] }
pallet-qubitum-runtime-api.workspace = true
qubitum-protocol.workspace = true
sp-api.workspace = true
sp-blockchain.workspace = true
sp-runtime.workspace = true
subtensor-runtime-common.workspace = true

[dev-dependencies]
pallet-qubitum = { workspace = true, features = ["std"] }

[features]
default = ["std"]
std = [
	"codec/std",
	"pallet-qubitum-runtime-api/std",
	"qubitum-protocol/std",
	"sp-api/std",
	"sp-runtime/std",
	"subtensor-runtime-common/std",
]
