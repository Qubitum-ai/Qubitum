[package]
name = "pallet-qubitum"
version = "0.1.0"
description = "FRAME pallet for Qubitum private verifiable AI inference protocol."
authors = ["Qubitum AI"]
homepage = "https://qubitum.ai"
edition.workspace = true
license = "Unlicense"
publish = false
repository = "https://github.com/Qubitum-ai/Qubitum"

[lints]
workspace = true

[dependencies]
codec = { workspace = true, features = ["derive", "max-encoded-len"] }
frame-benchmarking = { workspace = true, optional = true }
frame-support.workspace = true
frame-system.workspace = true
pallet-balances.workspace = true
qubitum-protocol.workspace = true
scale-info = { workspace = true, features = ["derive"] }
sp-runtime.workspace = true
sp-std.workspace = true

[dev-dependencies]
sp-core.workspace = true
sp-io.workspace = true

[features]
default = ["std"]
std = [
	"codec/std",
	"frame-benchmarking?/std",
	"frame-support/std",
	"frame-system/std",
	"pallet-balances/std",
	"qubitum-protocol/std",
	"scale-info/std",
	"sp-core/std",
	"sp-io/std",
	"sp-runtime/std",
	"sp-std/std",
]
runtime-benchmarks = [
	"dep:frame-benchmarking",
	"frame-benchmarking/runtime-benchmarks",
	"frame-support/runtime-benchmarks",
	"frame-system/runtime-benchmarks",
	"pallet-balances/runtime-benchmarks",
	"sp-runtime/runtime-benchmarks",
]
try-runtime = [
	"frame-support/try-runtime",
	"frame-system/try-runtime",
	"pallet-balances/try-runtime",
	"sp-runtime/try-runtime",
]
